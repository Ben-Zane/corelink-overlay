[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=18,20,26,255

[Metadata]
Name=CoreLink
Author=CoreLink
Information=CPU overlay from MSI Afterburner shared memory. Polls every 1000ms.
Version=1.0.0
License=MIT

[Variables]
W=360
Pad=16
Fg=243,244,246
Muted=139,144,154
Subtle=92,97,107
Heat=226,61,44
Raised=25,28,35
Ok=61,220,151

[MeasureCPU]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=144
MinValue=0
MaxValue=100

[MeasureTemp]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=128
MinValue=0
MaxValue=100

[MeasureClock]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=160

[MeasurePower]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=256

[MeasureRAM]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=145
MinValue=0
MaxValue=100

[MeterChrome]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#W#,430,18 | Fill Color 18,20,26,255 | StrokeWidth 1 | Stroke Color 42,45,52,255
AntiAlias=1

[MeterTitle]
Meter=String
X=#Pad#
Y=14
FontFace=Segoe UI
FontSize=10
FontColor=#Fg#
FontWeight=600
AntiAlias=1
Text=CORELINK

[MeterSub]
Meter=String
X=#Pad#
Y=32
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=Afterburner CPU overlay

[MeterLive]
Meter=String
X=(#W#-#Pad#)
Y=16
StringAlign=Right
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
FontWeight=600
AntiAlias=1
Text=LIVE  1000ms

[MeterUsage]
Meter=String
MeasureName=MeasureCPU
X=(#W#/2)
Y=70
StringAlign=Center
FontFace=Consolas
FontSize=36
FontColor=#Fg#
AntiAlias=1
NumOfDecimals=0
Text=%1
Postfix=%

[MeterUsageLabel]
Meter=String
X=(#W#/2)
Y=118
StringAlign=Center
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
FontWeight=600
StringCase=Upper
AntiAlias=1
Text=USAGE

[MeterBarCPU]
Meter=Bar
MeasureName=MeasureCPU
X=#Pad#
Y=148
W=(#W#-#Pad#*2)
H=8
BarColor=#Heat#
SolidColor=#Raised#
BarOrientation=Horizontal

[MeterTempL]
Meter=String
X=#Pad#
Y=176
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
FontWeight=600
AntiAlias=1
Text=TEMP

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
X=#Pad#
Y=194
FontFace=Consolas
FontSize=16
FontColor=#Fg#
AntiAlias=1
NumOfDecimals=0
Text=%1
Postfix= C

[MeterClockL]
Meter=String
X=(#W#/2)
Y=176
StringAlign=Center
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
FontWeight=600
AntiAlias=1
Text=CLOCK

[MeterClock]
Meter=String
MeasureName=MeasureClock
X=(#W#/2)
Y=194
StringAlign=Center
FontFace=Consolas
FontSize=16
FontColor=#Fg#
AntiAlias=1
NumOfDecimals=0
Text=%1
Postfix= MHz

[MeterPowerL]
Meter=String
X=(#W#-#Pad#)
Y=176
StringAlign=Right
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
FontWeight=600
AntiAlias=1
Text=POWER

[MeterPower]
Meter=String
MeasureName=MeasurePower
X=(#W#-#Pad#)
Y=194
StringAlign=Right
FontFace=Consolas
FontSize=16
FontColor=#Fg#
AntiAlias=1
NumOfDecimals=1
Text=%1
Postfix= W

[MeterGraph]
Meter=Line
MeasureName=MeasureCPU
X=#Pad#
Y=250
W=(#W#-#Pad#*2)
H=72
LineCount=1
LineColor=#Fg#
HorizontalLines=0
AntiAlias=1
AutoScale=0
MinValue=0
MaxValue=100

[MeterRAM]
Meter=String
MeasureName=MeasureRAM
X=#Pad#
Y=338
FontFace=Segoe UI
FontSize=8
FontColor=#Subtle#
AntiAlias=1
NumOfDecimals=0
Text=RAM  %1%

[MeterFoot]
Meter=String
X=(#W#-#Pad#)
Y=338
StringAlign=Right
FontFace=Segoe UI
FontSize=8
FontColor=#Subtle#
AntiAlias=1
Text=MAHM shared memory
