[Rainmeter]
Update=#UpdateMs#
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
ContextTitle=500 ms
ContextAction=[!WriteKeyValue Variables UpdateMs 500][!WriteKeyValue Rainmeter Update 500][!Refresh]
ContextTitle2=1000 ms
ContextAction2=[!WriteKeyValue Variables UpdateMs 1000][!WriteKeyValue Rainmeter Update 1000][!Refresh]
ContextTitle3=2000 ms
ContextAction3=[!WriteKeyValue Variables UpdateMs 2000][!WriteKeyValue Rainmeter Update 2000][!Refresh]
ContextTitle4=3000 ms
ContextAction4=[!WriteKeyValue Variables UpdateMs 3000][!WriteKeyValue Rainmeter Update 3000][!Refresh]
ContextTitle5=---
ContextAction5=[]
ContextTitle6=Package CPU
ContextAction6=[!HideMeterGroup Cores][!WriteKeyValue Variables CoreMode package][!SetOption MeterChrome Shape "Rectangle 0,0,#W#,600,18 | Fill Color #Bg# | StrokeWidth 1 | Stroke Color #Line#"][!UpdateMeter MeterChrome][!Redraw]
ContextTitle7=All cores
ContextAction7=[!ShowMeterGroup Cores][!WriteKeyValue Variables CoreMode all][!SetOption MeterChrome Shape "Rectangle 0,0,#W#,680,18 | Fill Color #Bg# | StrokeWidth 1 | Stroke Color #Line#"][!UpdateMeter MeterChrome][!Redraw]

[Metadata]
Name=CoreLink
Author=CoreLink
Information=CPU + GPU Afterburner overlay with settings.
Version=1.5.4
License=MIT

[Variables]
W=380
Pad=16
Fg=243,244,246
Muted=139,144,154
Subtle=92,97,107
Line=42,45,52
Bg=18,20,26
Raised=25,28,35
Heat=226,61,44
Ok=61,220,151
Blue=70,140,230
Cyan=70,210,220
Green=80,200,120
Orange=230,140,60
VramMB=12288
GpuIndex=0
UpdateMs=1000
CoreMode=all

[IncludeCores]
@Include=Cores.inc

[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
UpdateDivider=-1
RegExpSubstitute=1
Substitute="\(R\)":"","\(TM\)":"","CPU @.*":"","  +":" ","^ +":""," +$":""

[MeasureThreads]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Session Manager\Environment
RegValue=NUMBER_OF_PROCESSORS
UpdateDivider=-1

[MeasureGPUName]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
GPUDescriptor=DisplayName
UpdateDivider=5
RegExpSubstitute=1
Substitute="(?i)^$":"NVIDIA GeForce RTX 5070 12 GB"

[MeasureCPU]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=144
MinValue=0
MaxValue=100

[MeasureTemp]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=128
MinValue=0
MaxValue=100

[MeasureClock]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=160

[MeasurePower]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=256

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMPct]
Measure=Calc
Formula=100 * MeasureRAM / MeasureRAMTotal
MinValue=0
MaxValue=100

[MeasureGPUUsage]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=48
MinValue=0
MaxValue=100

[MeasureGPUMem]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=49
MinValue=0
MaxValue=#VramMB#

[MeasureGPUTemp]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=0
MinValue=0
MaxValue=100

[MeasureGPUFan]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=16
MinValue=0
MaxValue=100

[MeasureGPUCore]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=32
MinValue=0
MaxValue=3500

[MeasureGPUMemClk]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=34
MinValue=0
MaxValue=16000

[MeterChrome]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#W#,680,18 | Fill Color #Bg# | StrokeWidth 1 | Stroke Color #Line#
AntiAlias=1

[MeterTitle]
Meter=String
X=#Pad#
Y=14
FontFace=Segoe UI
FontSize=10
FontColor=#Fg#
FontWeight=600
AntiAlias=1
Text=CORELINK

