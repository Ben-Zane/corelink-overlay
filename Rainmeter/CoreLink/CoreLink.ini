[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureCores "Run"]

[Metadata]
Name=CoreLink
Author=CoreLink
Information=CPU + GPU overlay from MSI Afterburner. 1000ms.
Version=1.4.0
License=MIT

[Variables]
W=380
Pad=16
Fg=243,244,246
Muted=139,144,154
Subtle=92,97,107
Line=42,45,52
Bg=18,20,26
Raised=25,28,35
Heat=226,61,44
Ok=61,220,151
Warn=217,164,65
Blue=70,140,230
Cyan=70,210,220
Green=80,200,120
Orange=230,140,60
VramMB=12288
GpuIndex=0

[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
UpdateDivider=-1
RegExpSubstitute=1
Substitute="\(R\)":"","\(TM\)":"","CPU @.*":"","  +":" ","^ +":""," +$":""

[MeasureThreads]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Session Manager\Environment
RegValue=NUMBER_OF_PROCESSORS
UpdateDivider=-1

[MeasureCores]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "(Get-CimInstance Win32_Processor).NumberOfCores"
OutputType=ANSI
UpdateDivider=-1
Timeout=8000
RegExpSubstitute=1
Substitute="\s":""

[MeasureGPUName]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
GPUDescriptor=DisplayName
UpdateDivider=5
RegExpSubstitute=1
Substitute="(?i)^$":"NVIDIA GeForce RTX 5070 12 GB"

[MeasureCPU]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=144
MinValue=0
MaxValue=100

[MeasureTemp]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=128
MinValue=0
MaxValue=100

[MeasureClock]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=160

[MeasurePower]
Measure=Plugin
Plugin=MSIAfterburner
GPU=-1
SourceId=256

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureGPUUsage]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=48
MinValue=0
MaxValue=100

[MeasureGPUMem]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=49
MinValue=0
MaxValue=#VramMB#

[MeasureGPUTemp]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=0
MinValue=0
MaxValue=100

[MeasureGPUFan]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=16
MinValue=0
MaxValue=100

[MeasureGPUCore]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=32
MinValue=0
MaxValue=3500

[MeasureGPUMemClk]
Measure=Plugin
Plugin=MSIAfterburner
GPU=#GpuIndex#
SourceId=34
MinValue=0
MaxValue=16000

[MeterChrome]
Meter=Shape
X=0
Y=0
